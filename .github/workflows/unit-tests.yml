# Unit-Tests bei jedem Push und Pull Request (#525). Läuft auf Linux: schneller als Windows und deckt im Testcode
# Windows-Annahmen auf (feste Pfade, Groß-/Kleinschreibung). Bis zur Veröffentlichung (#636) sprach zudem das
# Minutenbudget dafür. Domain, Application, Infrastructure und die Unit-Tests zielen auf net10.0;
# die Projekte für Windows (WinUi, GUI-Tests) baut dieser Job nicht.
name: Unit-Tests

on:
  push:
    branches: [main, 'ci/**']
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Echtes PostgreSQL für die Tests unter Persistenz/ (#49: Sortierung, Umlaute, Verbindungsprüfung)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Wie auf dem Entwicklungsrechner: deutsche Kultur und Zeitzone, damit Formatierungen gleich ausfallen
      LANG: de_DE.UTF-8
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # pg_dump/pg_restore für die Sicherungstests (#43). Das Runner-Image bringt nur ältere Client-Werkzeuge mit, und
      # ein älteres pg_dump verweigert die Sicherung des neueren Servers im Dienst-Container.
      - name: PostgreSQL-Werkzeuge 17
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Unit-Tests
        env:
          # Gesetzt heißt: Die Tests gegen PostgreSQL müssen laufen, statt sich zu überspringen
          TURNIERVERWALTUNG_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
        run: >
          dotnet test --project tests/Fussballturnierverwaltung.Tests -c Release
          --results-directory TestResults
          --report-xunit-trx --report-xunit-trx-filename unit-tests.trx
          --report-xunit-markdown --report-xunit-markdown-filename unit-tests.md

      - name: Zusammenfassung
        if: always()
        run: |
          if [ -f TestResults/unit-tests.md ]; then cat TestResults/unit-tests.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests
          path: TestResults/unit-tests.trx
          if-no-files-found: ignore
