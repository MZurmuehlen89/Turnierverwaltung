# GUI-Tests (#525) auf dem GitHub-Runner windows-2025: Desktop-Sitzung für UI Automation, das vorinstallierte
# PostgreSQL des Runners (#49). Seit das Repo öffentlich ist, kosten Actions-Minuten nichts (#636): Der Komplettlauf
# startet bei jedem Push und Pull Request wie die Unit-Tests, manuell lässt er sich mit Filter starten.
# Kein self-hosted Runner (#609 verworfen): Ein Fremd-PR kann den Workflow ändern und so eigenen Code auf dem
# Runner-Rechner ausführen.
name: GUI-Tests

on:
  push:
    branches: [main, 'ci/**']
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      xunit_argumente:
        description: 'Filter für den xunit-Runner, z. B. "-class Fussballturnierverwaltung.GuiTests.MannschaftsPflegeTests" (leer = alle)'
        required: false
        default: ''

# Je Ereignisart eine Gruppe: Ein gezielter manueller Lauf bricht den automatischen Komplettlauf desselben Branches
# nicht ab; ein neuer Push dagegen den vorigen schon
concurrency:
  group: gui-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gui-tests:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ERGEBNISSE: ${{ github.workspace }}\TestResults
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Virtualisierte Listen und das Layout hängen von der Fenstergröße ab: Auflösung festhalten und hochsetzen,
      # soweit der Runner es zulässt (windows-2025: Standard 1024×768)
      - name: Bildschirmauflösung
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          "vorher: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop }
          catch { "Auflösung nicht änderbar: $($_.Exception.Message)" }
          "nachher: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      # Der Runner bringt PostgreSQL mit, der Dienst ist aber abgeschaltet (Image-Readme: postgresql-x64-17, Anmeldung
      # postgres/root). Eingerichtet wird wie auf einem Entwicklerrechner: Anmeldung „turnierverwaltung“ mit Kennwort in
      # pgpass.conf des Runner-Benutzers – die App und die Testdatenbank finden es dort.
      - name: PostgreSQL starten und einrichten
        env:
          PGPASSWORD: root
        run: |
          Set-Service postgresql-x64-17 -StartupType Manual
          Start-Service postgresql-x64-17
          ./build/PostgreSQL-Einrichten.ps1

      # Bricht früh ab, wenn die App sich nicht anmelden kann – sonst scheitert jeder GUI-Test einzeln am Start (#49)
      - name: Anmeldung der App prüfen
        run: |
          foreach ($ebene in 'Process', 'User', 'Machine') {
              "PGPASSWORD ($ebene) gesetzt: $([bool][Environment]::GetEnvironmentVariable('PGPASSWORD', $ebene))"
          }
          "pgpass.conf: $((Get-Content "$env:APPDATA\postgresql\pgpass.conf" | Measure-Object).Count) Zeile(n)"
          & "$env:PGBIN\psql.exe" -h localhost -U turnierverwaltung -w -d turnierverwaltung -tAc "SELECT current_user"
          if ($LASTEXITCODE -ne 0) { throw 'Anmeldung als turnierverwaltung über pgpass.conf scheitert.' }

      - name: Framework-Tests
        run: >
          dotnet test --project tests/GuiTest.Framework.Tests
          --results-directory $env:ERGEBNISSE
          --report-xunit-trx --report-xunit-trx-filename framework-tests.trx
          --report-xunit-markdown --report-xunit-markdown-filename framework-tests.md

      - name: GUI-Tests
        env:
          # Über eine Umgebungsvariable statt direkt eingesetzt, damit die Eingabe nicht als Skriptcode läuft
          XUNIT_ARGUMENTE: ${{ inputs.xunit_argumente }}
        run: |
          $filter = @($env:XUNIT_ARGUMENTE -split '\s+' | Where-Object { $_ })
          ./build/GuiTests-Ausfuehren.ps1 @filter `
              -result-trx "$env:ERGEBNISSE\gui-tests.trx" `
              -result-markdown "$env:ERGEBNISSE\gui-tests.md"

      - name: Zusammenfassung
        if: always()
        run: |
          foreach ($datei in 'framework-tests.md', 'gui-tests.md') {
              $pfad = Join-Path $env:ERGEBNISSE $datei
              if (Test-Path $pfad) { Get-Content $pfad | Add-Content $env:GITHUB_STEP_SUMMARY }
          }

      - name: Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-tests
          path: TestResults/*.trx
          if-no-files-found: ignore

      # Bildschirmfotos, Log-Auszüge und App-Log fehlgeschlagener Tests (artifacts/guitest/laeufe/<Lauf>)
      - name: Belege fehlgeschlagener Tests hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gui-tests-belege
          path: artifacts/guitest/laeufe/
          if-no-files-found: ignore
