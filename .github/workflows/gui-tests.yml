# GUI-Tests auf Knopfdruck (#525): Windows-Runner mit Desktop-Sitzung für UI Automation, SQL Server LocalDB statt
# des lokalen SQL Servers. Standard ist der GitHub-Runner windows-2025 (kostet doppelt zählende Windows-Minuten).
# Der eigene Runner in der VirtualBox-VM (#609, build/GuiRunner-VM-Aufbauen.ps1) verbraucht keine Minuten, ist aber
# noch nicht eingerichtet: Ohne registrierten Runner wartet der Job bis zu 24 h in der Warteschlange. Sobald die VM
# läuft, den Standard wieder auf „eigener“ stellen.
name: GUI-Tests

on:
  workflow_dispatch:
    inputs:
      xunit_argumente:
        description: 'Filter für den xunit-Runner, z. B. "-class Fussballturnierverwaltung.GuiTests.MannschaftsPflegeTests" (leer = alle)'
        required: false
        default: ''
      runner:
        description: 'Wo die Tests laufen: eigener Runner (VirtualBox-VM) oder GitHub-Runner windows-2025 (kostet Minuten)'
        type: choice
        options:
          - windows-2025
          - eigener
        default: windows-2025

concurrency:
  group: gui-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gui-tests:
    runs-on: ${{ inputs.runner == 'windows-2025' && 'windows-2025' || fromJSON('["self-hosted", "windows", "gui"]') }}
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ERGEBNISSE: ${{ github.workspace }}\TestResults
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Virtualisierte Listen und das Layout hängen von der Fenstergröße ab: Auflösung festhalten und hochsetzen,
      # soweit der Runner es zulässt (windows-2025: Standard 1024×768; eigener Runner: fest 1920×1080 über die
      # VirtualBox-Einstellung VBoxInternal2/EfiGraphicsResolution, der Versuch ändert dort nichts)
      - name: Bildschirmauflösung
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          "vorher: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop }
          catch { "Auflösung nicht änderbar: $($_.Exception.Message)" }
          "nachher: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      - name: LocalDB starten
        run: |
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      - name: Framework-Tests
        run: >
          dotnet test --project tests/GuiTest.Framework.Tests
          --results-directory $env:ERGEBNISSE
          --report-xunit-trx --report-xunit-trx-filename framework-tests.trx
          --report-xunit-markdown --report-xunit-markdown-filename framework-tests.md

      - name: GUI-Tests
        env:
          TURNIERVERWALTUNG_GUITEST_SERVER: (localdb)\MSSQLLocalDB
          # Über eine Umgebungsvariable statt direkt eingesetzt, damit die Eingabe nicht als Skriptcode läuft
          XUNIT_ARGUMENTE: ${{ inputs.xunit_argumente }}
        run: |
          $filter = @($env:XUNIT_ARGUMENTE -split '\s+' | Where-Object { $_ })
          ./build/GuiTests-Ausfuehren.ps1 @filter `
              -result-trx "$env:ERGEBNISSE\gui-tests.trx" `
              -result-markdown "$env:ERGEBNISSE\gui-tests.md"

      - name: Zusammenfassung
        if: always()
        run: |
          foreach ($datei in 'framework-tests.md', 'gui-tests.md') {
              $pfad = Join-Path $env:ERGEBNISSE $datei
              if (Test-Path $pfad) { Get-Content $pfad | Add-Content $env:GITHUB_STEP_SUMMARY }
          }

      - name: Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-tests
          path: TestResults/*.trx
          if-no-files-found: ignore

      # Bildschirmfotos, Log-Auszüge und App-Log fehlgeschlagener Tests (artifacts/guitest/laeufe/<Lauf>)
      - name: Belege fehlgeschlagener Tests hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gui-tests-belege
          path: artifacts/guitest/laeufe/
          if-no-files-found: ignore
