# Dependabot (#542): hält NuGet-Pakete und GitHub-Actions-Versionen aktuell. Wöchentlich und gruppiert, damit es
# wenige PRs gibt und das Actions-Budget geschont wird (jeder PR startet die Unit-Tests, #525). Minor- und
# Patch-Updates landen in Gruppen, Major-Updates kommen einzeln, weil sie eigens geprüft werden (CLAUDE.md).
version: 2

updates:
  - package-ecosystem: nuget
    # Projektverzeichnisse einzeln: über „/“ und die .slnx fand Dependabot im ersten Lauf nur das Testprojekt
    # (EF Core InMemory auf 10.0.14, SqlServer/Design in Infrastructure blieben auf 10.0.13). „/“ bleibt für die
    # Analyzer in Directory.Build.props. tools/ wird bewusst nicht aktualisiert.
    directories:
      - /
      - /src/*
      - /tests/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: chore
      include: scope
    groups:
      # EF Core, Microsoft.Extensions und Pkcs kommen aus demselben .NET-Release und hängen voneinander ab: getrennt
      # scheiterte EF Core 10.0.14 an Logging.Abstractions 10.0.13 (NU1605, Downgrade) – deshalb eine Gruppe
      dotnet:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions*"
          - "System.Security.Cryptography.Pkcs"
        update-types: [minor, patch]
      windows-sdk:
        patterns: ["Microsoft.WindowsAppSDK", "Microsoft.Windows.SDK*"]
        update-types: [minor, patch]
      analyzer:
        patterns: ["SonarAnalyzer.CSharp", "Roslynator*"]
        update-types: [minor, patch]
      testpakete:
        patterns:
          - "xunit*"
          - "FluentAssertions"
          - "FlaUI*"
          - "Microsoft.Testing*"
          - "Microsoft.NET.Test.Sdk"
          - "NetArchTest*"
        update-types: [minor, patch]
      # Auffanggruppe: schließt die Muster der anderen Gruppen ausdrücklich aus – nur „zuletzt stehen“ reichte nicht,
      # im ersten Lauf übernahm sie die dotnet-Gruppe (PR #556 „superseded by #557“)
      uebrige:
        patterns: ["*"]
        exclude-patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions*"
          - "System.Security.Cryptography.Pkcs"
          - "Microsoft.WindowsAppSDK"
          - "Microsoft.Windows.SDK*"
          - "SonarAnalyzer.CSharp"
          - "Roslynator*"
          - "xunit*"
          - "FluentAssertions"
          - "FlaUI*"
          - "Microsoft.Testing*"
          - "Microsoft.NET.Test.Sdk"
          - "NetArchTest*"
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
