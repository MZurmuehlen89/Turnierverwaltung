# Dependabot (#542): hält NuGet-Pakete und GitHub-Actions-Versionen aktuell. Wöchentlich und gruppiert, damit es
# wenige PRs gibt (jeder PR startet Unit- und GUI-Tests, #525, #636). Minor- und
# Patch-Updates landen in Gruppen, Major-Updates kommen einzeln, weil sie eigens geprüft werden (CLAUDE.md).
version: 2

updates:
  - package-ecosystem: nuget
    # Projektverzeichnisse einzeln: über „/“ und die .slnx fand Dependabot im ersten Lauf nur das Testprojekt
    # (EF Core InMemory auf 10.0.14, SqlServer/Design in Infrastructure blieben auf 10.0.13; SQL Server entfiel mit #49). „/“ bleibt für die
    # Analyzer in Directory.Build.props. tools/ wird bewusst nicht aktualisiert.
    directories:
      - /
      - /src/*
      - /tests/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: chore
      include: scope
    groups:
      # EF Core, Microsoft.Extensions und ProtectedData kommen aus demselben .NET-Release und hängen voneinander ab:
      # getrennt scheiterte EF Core 10.0.14 an Logging.Abstractions 10.0.13 (NU1605, Downgrade) – deshalb eine Gruppe.
      # Npgsql (EF-Provider und ADO-Treiber der GUI-Tests, #49) folgt der Hauptversion von EF Core und kommt mit.
      dotnet:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions*"
          - "System.Security.Cryptography.ProtectedData"
          - "Npgsql*"
        update-types: [minor, patch]
      windows-sdk:
        patterns: ["Microsoft.WindowsAppSDK", "Microsoft.Windows.SDK*"]
        update-types: [minor, patch]
      analyzer:
        patterns: ["SonarAnalyzer.CSharp", "Roslynator*"]
        update-types: [minor, patch]
      testpakete:
        patterns:
          - "xunit*"
          - "FluentAssertions"
          - "FlaUI*"
          - "Microsoft.Testing*"
          - "Microsoft.NET.Test.Sdk"
          - "NetArchTest*"
        update-types: [minor, patch]
      # Auffanggruppe: schließt die Muster der anderen Gruppen ausdrücklich aus – nur „zuletzt stehen“ reichte nicht,
      # im ersten Lauf übernahm sie die dotnet-Gruppe (PR #556 „superseded by #557“)
      uebrige:
        patterns: ["*"]
        exclude-patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions*"
          - "System.Security.Cryptography.ProtectedData"
          - "Npgsql*"
          - "Microsoft.WindowsAppSDK"
          - "Microsoft.Windows.SDK*"
          - "SonarAnalyzer.CSharp"
          - "Roslynator*"
          - "xunit*"
          - "FluentAssertions"
          - "FlaUI*"
          - "Microsoft.Testing*"
          - "Microsoft.NET.Test.Sdk"
          - "NetArchTest*"
        update-types: [minor, patch]
    # ProtectedData (Kennwort der Datenbankverbindung, #49) folgt wie früher Pkcs der EF-Core-Linie (Nutzerentscheid
    # 11.11.2026, #646–#648): Patches 10.0.x kommen über die Gruppe dotnet, die Hauptversion zieht erst mit EF Core 11
    # nach. Mit dem Wechsel auf EF Core 11 diese Ausnahme entfernen.
    ignore:
      - dependency-name: "System.Security.Cryptography.ProtectedData"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
